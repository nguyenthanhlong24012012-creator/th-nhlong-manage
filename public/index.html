<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ManageBlox Pro Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: #0f172a; color: #e2e8f0; min-height: 100vh; padding: 20px; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 2.5rem; color: #38bdf8; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: #1e293b; border-radius: 16px; padding: 20px; border: 1px solid #334155; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); transition: 0.3s; position: relative; overflow: hidden; }
        .card:hover { border-color: #38bdf8; transform: translateY(-5px); }
        .status-badge { position: absolute; top: 15px; right: 15px; padding: 5px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
        .online { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #4ade80; }
        .offline { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #f87171; }
        .user-info { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
        .avatar { width: 60px; height: 60px; border-radius: 50%; background: #334155; border: 2px solid #38bdf8; object-fit: cover; }
        .username { font-size: 1.2rem; font-weight: bold; color: #fff; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.9rem; }
        .val { font-weight: 600; color: #facc15; }
        
        /* Thanh Level Max 2800 */
        .progress-bg { background: #334155; height: 12px; border-radius: 6px; overflow: hidden; margin-top: 5px; margin-bottom: 15px; }
        .progress-bar { background: linear-gradient(90deg, #38bdf8, #818cf8); height: 100%; border-radius: 6px; transition: width 0.5s ease; }
        
        .inventory { display: flex; gap: 10px; margin-top: 15px; background: #0f172a; padding: 10px; border-radius: 10px; justify-content: space-around; }
        .item { text-align: center; }
        .item img { width: 45px; height: 45px; object-fit: contain; filter: drop-shadow(0 0 5px rgba(255,255,255,0.2)); }
        .item span { display: block; font-size: 0.75rem; color: #94a3b8; margin-top: 5px; }
    </style>
</head>
<body>

<div class="header">
    <h1>Quản Lý Trạm Farm</h1>
    <p>Hệ thống đồng bộ trực tiếp với máy chủ Roblox</p>
</div>

<div class="grid-container" id="accounts-grid">
    <!-- Các tài khoản sẽ xuất hiện ở đây -->
</div>

<script>
    // Kho ảnh lấy chuẩn từ Blox Fruits Wiki
    const imageLib = {
        "Godhuman": "https://static.wikia.nocookie.net/blox-fruits/images/1/1d/Godhuman_Icon.png",
        "Sanguine Art": "https://static.wikia.nocookie.net/blox-fruits/images/3/36/Sanguine_Art_Icon.png",
        "Kitsune Fruit": "https://static.wikia.nocookie.net/blox-fruits/images/9/98/Kitsune_Fruit_Icon.png",
        "Dough Fruit": "https://static.wikia.nocookie.net/blox-fruits/images/6/67/Dough_Fruit_Icon.png",
        "Cursed Dual Katana": "https://static.wikia.nocookie.net/blox-fruits/images/5/52/Cursed_Dual_Katana_Icon.png",
        "Shark Anchor": "https://static.wikia.nocookie.net/blox-fruits/images/4/4c/Shark_Anchor_Icon.png"
    };

    async function updateDashboard() {
        try {
            const res = await fetch('/api/get-account');
            const data = await res.json();
            const grid = document.getElementById('accounts-grid');
            grid.innerHTML = ''; // Xóa cũ vẽ mới

            if(data.length === 0) {
                grid.innerHTML = '<p style="text-align:center; width: 100%; color:#64748b;">Chưa có tài khoản nào kết nối...</p>';
                return;
            }

            data.forEach(acc => {
                // Tính phần trăm level max 2800
                const maxLevel = 2800;
                let percent = (acc.level / maxLevel) * 100;
                if(percent > 100) percent = 100;

                const statusClass = acc.status === "Online" ? "online" : "offline";
                const statusText = acc.status === "Online" ? "● Trực tuyến" : "○ Mất kết nối";

                // Map HTML hòm đồ
                let itemsHTML = acc.inventory.map(item => `
                    <div class="item">
                        <img src="${imageLib[item] || 'https://via.placeholder.com/45/334155/FFFFFF?text=?'}" alt="${item}">
                        <span>${item}</span>
                    </div>
                `).join('');

                grid.innerHTML += `
                    <div class="card">
                        <div class="status-badge ${statusClass}">${statusText}</div>
                        <div class="user-info">
                            <img class="avatar" src="https://roblox-avatar.luis-104.workers.dev/?username=${acc.username}" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/7/7c/Profile_avatar_placeholder_large.png'" alt="avatar">
                            <div>
                                <div class="username">${acc.username}</div>
                                <div style="font-size:0.8rem; color:#94a3b8;">Race: ${acc.race}</div>
                            </div>
                        </div>
                        
                        <div class="stat-row">
                            <span>Level: <b class="val" style="color:#fff">${acc.level}</b> / ${maxLevel}</span>
                            <span>${percent.toFixed(1)}%</span>
                        </div>
                        <div class="progress-bg"><div class="progress-bar" style="width: ${percent}%;"></div></div>

                        <div class="stat-row">
                            <span>💵 Beli: <span class="val">${acc.beli}</span></span>
                            <span>🟣 Frag: <span class="val">${acc.frag}</span></span>
                        </div>

                        <div class="inventory">
                            ${itemsHTML}
                        </div>
                    </div>
                `;
            });
        } catch(e) {
            console.error("Lỗi cập nhật bảng điều khiển:", e);
        }
    }

    // Quét web mỗi 3 giây để giao diện mượt
    setInterval(updateDashboard, 3000);
    updateDashboard();
</script>
</body>
</html>
